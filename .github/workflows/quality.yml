name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:server
      - run: npm run check:jarvis
      - run: npm run check:portfolio-contracts
      - run: npm run test:authority
      - run: npm run build

  production-smoke:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the Git-connected deployment
        if: github.event_name == 'push'
        run: sleep 45
      - run: npm run smoke:production
        env:
          AUTHORITY_PRODUCTION_URL: ${{ vars.AUTHORITY_PRODUCTION_URL || 'https://authority-engine-app.vercel.app' }}
